name: Data - daily delta

# Fetch only what changed since the last stored observation. The database lives
# in Neon, so there is no database cache or artifact to manage here.
# Market data only: this job never writes or caches policy snapshots.

on:
  # The push trigger only registers the workflow on first push; the daily work
  # is done by the schedule. Paths keep it from running on ordinary commits.
  push:
    branches: [public, main]
    paths:
      - .github/workflows/data-daily.yml
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetlens-data-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSETLENS_LOG_LEVEL: INFO
      ASSETLENS_MAX_RETRIES: "5"
      ASSETLENS_REQUEST_DELAY_SECONDS: "1"
      ASSETLENS_DATABASE_URL: ${{ secrets.ASSETLENS_DATABASE_URL }}
      ASSETLENS_MIGRATION_DATABASE_URL: ${{ secrets.ASSETLENS_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check database secrets
        run: |
          test -n "$ASSETLENS_DATABASE_URL" || {
            echo "::error::ASSETLENS_DATABASE_URL secret is missing"
            exit 1
          }
          test -n "$ASSETLENS_MIGRATION_DATABASE_URL" || {
            echo "::error::ASSETLENS_MIGRATION_DATABASE_URL secret is missing"
            exit 1
          }

      - name: Prepare schema
        run: uv run assetlens init-db

      - name: Incremental sync
        run: uv run assetlens sync

      - name: Verify database
        run: uv run assetlens instruments list
