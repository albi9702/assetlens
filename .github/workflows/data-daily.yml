name: Data - daily delta

# Fetch only what changed since the last stored observation. The database is
# restored from the Actions cache; if the cache is gone, the job falls back to a
# full backfill so a missing cache can never leave a partial history.
# Market data only: this job never writes or caches policy snapshots.

on:
  # The push trigger only registers the workflow on first push; the daily work
  # is done by the schedule. Paths keep it from running on ordinary commits.
  push:
    branches: [public, main]
    paths:
      - .github/workflows/data-daily.yml
  schedule:
    - cron: "17 4 * * *" # 04:17 UTC every day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetlens-data-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASSETLENS_LOG_LEVEL: INFO
      ASSETLENS_MAX_RETRIES: "5"
      ASSETLENS_REQUEST_DELAY_SECONDS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Make data directory
        run: mkdir -p data

      - name: Restore last database
        uses: actions/cache@v4
        with:
          path: data/assetlens.db
          key: assetlens-market-db-${{ github.run_id }}
          restore-keys: |
            assetlens-market-db-

      - name: Detect restored database
        id: db-state
        run: |
          if [ -f data/assetlens.db ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare schema
        run: uv run assetlens init-db

      - name: Incremental sync
        if: steps.db-state.outputs.exists == 'true'
        run: uv run assetlens sync

      - name: Full backfill (cache was empty)
        if: steps.db-state.outputs.exists != 'true'
        run: uv run assetlens sync --full

      - name: Verify database
        run: uv run assetlens instruments list

      - name: Upload database snapshot
        uses: actions/upload-artifact@v4
        with:
          name: assetlens-market-db-daily
          path: data/assetlens.db
          retention-days: 7
          if-no-files-found: error
