name: Data - monthly full load

# Rebuild the whole market history once a month with idempotent upserts. This
# heals drift or missing days without deleting the Neon database.
# Market data only: this job never writes or caches policy snapshots.

on:
  # The push trigger only registers the workflow on first push; the monthly work
  # is done by the schedule. Paths keep it from running on ordinary commits.
  push:
    branches: [public, main]
    paths:
      - .github/workflows/data-monthly.yml
  schedule:
    - cron: "23 5 1 * *" # 05:23 UTC on the first day of the month
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetlens-data-monthly
  cancel-in-progress: false

jobs:
  full-load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ASSETLENS_LOG_LEVEL: INFO
      ASSETLENS_MAX_RETRIES: "5"
      ASSETLENS_REQUEST_DELAY_SECONDS: "1"
      ASSETLENS_DATABASE_URL: ${{ secrets.ASSETLENS_DATABASE_URL }}
      ASSETLENS_MIGRATION_DATABASE_URL: ${{ secrets.ASSETLENS_MIGRATION_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check database secrets
        run: |
          test -n "$ASSETLENS_DATABASE_URL" || {
            echo "::error::ASSETLENS_DATABASE_URL secret is missing"
            exit 1
          }
          test -n "$ASSETLENS_MIGRATION_DATABASE_URL" || {
            echo "::error::ASSETLENS_MIGRATION_DATABASE_URL secret is missing"
            exit 1
          }

      - name: Prepare schema
        run: uv run assetlens init-db

      - name: Full backfill
        run: uv run assetlens sync --full

      - name: Verify database
        run: uv run assetlens instruments list
